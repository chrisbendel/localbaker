# Every poll takes a write lock on a queue DB shared by puma, the supervisor, the
# dispatcher, and the worker, so poll as slowly as each process tolerates.
default: &default
  dispatchers:
    # Only promotes future-dated jobs, and the sole one is PickupReminderJob, days out.
    - polling_interval: 60
      batch_size: 100
  workers:
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # Delay before a ready job starts — the login code email. Someone is waiting.
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
