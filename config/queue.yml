# Every poll takes a write lock on a SQLite queue DB shared by puma, the
# supervisor, the dispatcher, and the worker, so polling is as slow as each
# process can tolerate.
#
# The dispatcher only promotes future-dated jobs to ready, and the sole
# future-dated job is PickupReminderJob, scheduled hours or days ahead — minutes
# of lag there are invisible.
#
# The worker interval is the delay before a ready job starts, which is the login
# code email in SessionsController. Keep it short; someone is watching an inbox.
default: &default
  dispatchers:
    - polling_interval: 60
      batch_size: 100
  workers:
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
