#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # No sleeps between batches: they keep the job alive for minutes, taking and releasing
  # the write lock the whole time — a long window for `database is locked`.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(batch_size: 200, sleep_between_batches: 0)"
    schedule: every day at 4:12am
