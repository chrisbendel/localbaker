default: &default
  adapter: sqlite3
  # RAILS_MAX_THREADS is 2 in production and Solid Queue workers run 1 thread,
  # so 5 is headroom. Each connection carries its own SQLite page cache, and
  # five processes share this pool config — an oversized pool is wasted RAM.
  max_connections: <%= ENV.fetch("DB_POOL") { 5 } %>
  # busy_timeout, in ms. Measured in wall clock, so it has to cover a VM that
  # gets frozen by CPU throttling mid-transaction, not just normal contention.
  timeout: 20000


development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path += "_cache" } if ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path += "_queue" } if ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
    url: <%= URI.parse(ENV["DATABASE_URL"]).tap { |url| url.path += "_cable" } if ENV["DATABASE_URL"] %>
