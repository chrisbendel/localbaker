# fly.toml app configuration file generated for localbaker on 2026-03-23
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'localbaker'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

# Puma has to stop accepting, drain, and then let the Solid Queue supervisor
# shut its dispatcher and worker down. The 5s default SIGKILLs them mid-write,
# which surfaces as `database is locked` at process exit.
kill_timeout = '30s'

# Swap so a memory spike degrades instead of OOM-killing the machine. A swapfile
# on the machine's root disk — not billed RAM.
swap_size_mb = 512

[build]

[env]
  PORT = "3000"
  RAILS_MAX_THREADS = "2"
  LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/libjemalloc.so.2"

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
